<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Call - Zoom & Talkroom Mix</title>
    <!-- Include PeerJS for free, unlimited video call rooms -->
    <script src="https://unpkg.com"></script>
    <!-- Tailwind CSS for styling -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        /* Custom scrollbar for chat */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #161b22; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden m-0 p-0">

    <!-- ================= 1. ENTRY SCREEN (Talkroom Style) ================= -->
    <div id="entry-screen" class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-[#161b22] border border-[#30363d] p-8 rounded-xl w-full max-w-md shadow-2xl space-y-6">
            <div class="text-center">
                <h1 class="text-3xl font-bold text-white tracking-tight">Movie Call</h1>
                <p class="text-sm text-gray-400 mt-2">The Ultimate Watch Party & Video Chat Room</p>
            </div>

            <!-- Profile Customization -->
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Your Name</label>
                    <input type="text" id="username-input" placeholder="Enter your display name..." 
                           class="w-full bg-[#0d1117] border border-[#30363d] text-white px-4 py-2.5 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Profile Picture (Image or GIF Link)</label>
                    <input type="text" id="avatar-input" placeholder="Paste image/GIF URL (or leave blank for default)..." 
                           class="w-full bg-[#0d1117] border border-[#30363d] text-white px-4 py-2.5 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="border-t border-[#30363d] my-4"></div>

            <!-- Room Choice Buttons -->
            <div class="grid grid-cols-2 gap-4">
                <button onclick="showRoomOption('create')" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 cursor-pointer">
                    Host Room
                </button>
                <button onclick="showRoomOption('join')" class="bg-[#21262d] hover:bg-[#30363d] text-white font-medium py-2.5 px-4 rounded-lg border border-[#30363d] transition duration-200 cursor-pointer">
                    Join Room
                </button>
            </div>

            <!-- Contextual Input Fields -->
            <div id="room-action-container" class="hidden space-y-3 pt-2">
                <div>
                    <label id="room-label" class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Room Code</label>
                    <input type="text" id="room-id-input" placeholder="e.g., chill-zone-123" 
                           class="w-full bg-[#0d1117] border border-[#30363d] text-white px-4 py-2.5 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <button id="submit-room-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg shadow-md transition duration-200 mt-2 cursor-pointer">
                    Launch App
                </button>
            </div>
        </div>
    </div>

    <!-- ================= 2. MAIN APP DASHBOARD ================= -->
    <div id="app-dashboard" class="hidden flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Main Content Area: Left / Top (Shared TV Screen + Zoom Grid) -->
        <div class="flex-1 flex flex-col overflow-y-auto p-4 space-y-4">
            
            <!-- Virtual TV Monitor Panel -->
            <div class="w-full bg-[#161b22] border border-[#30363d] rounded-xl overflow-hidden shadow-xl aspect-video max-h-[50vh] relative group">
                <!-- Fallback/Standby View -->
                <div id="tv-standby" class="absolute inset-0 flex flex-col items-center justify-center bg-black z-10">
                    <div class="w-16 h-16 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-4 hidden" id="tv-loading-spinner"></div>
                    <p class="text-gray-400 text-lg font-medium tracking-wide" id="tv-status-text">📺 Main TV Screen: Standing By for Link...</p>
                </div>
                
                <!-- Shared Video Player/Iframe Area -->
                <div id="tv-player-container" class="w-full h-full bg-black">
                    <!-- Dynamic iFrame injected here securely via JavaScript -->
                </div>
            </div>

            <!-- Zoom Video Call Mesh Grid -->
            <div id="video-grid" class="flex-1 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 auto-rows-fr min-h-[250px]">
                <!-- Local Video Player Card -->
                <div class="bg-[#161b22] border border-blue-500/40 rounded-xl relative overflow-hidden group shadow-lg flex flex-col items-center justify-center">
                    <video id="local-video" autoplay muted playsinline class="w-full h-full object-cover rounded-xl absolute inset-0 z-0"></video>
                    <!-- Custom Profile Override Display Layer -->
                    <div id="local-avatar-bg" class="absolute inset-0 bg-[#161b22] flex flex-col items-center justify-center z-10 hidden">
                        <img id="local-avatar-img" src="https://unsplash.com" 
                             class="w-24 h-24 rounded-full border-4 border-[#30363d] object-cover shadow-inner">
                    </div>
                    
                    <div class="absolute bottom-2 left-2 right-2 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-lg flex items-center justify-between z-20 text-xs border border-[#30363d]">
                        <span id="local-name-tag" class="font-medium text-white truncate">You (Host)</span>
                        <div class="flex items-center space-x-1">
                            <span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 font-bold border border-amber-500/30">Host</span>
                        </div>
                    </div>
                </div>
                <!-- Guest video tracks get appended dynamically here -->
            </div>
        </div>

        <!-- Right Side Panel: Host Controls, Video Launcher, and Text Chat -->
        <div class="w-full md:w-80 bg-[#161b22] border-t md:border-t-0 md:border-l border-[#30363d] flex flex-col overflow-hidden shadow-2xl">
            
            <!-- Video Control Bar (Media Stream Controller) -->
            <div class="p-4 border-b border-[#30363d] space-y-3">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Sync Video Link</h3>
                <div class="flex space-x-2">
                    <input type="text" id="media-link-input" placeholder="Paste YouTube link here..." 
                           class="flex-1 bg-[#0d1117] border border-[#30363d] text-white px-3 py-1.5 rounded-lg text-sm focus:outline-none focus:border-blue-500">
                    <button onclick="broadcastMediaStream()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm px-4 rounded-lg transition cursor-pointer">
                        Sync
                    </button>
                </div>
            </div>

            <!-- In-App Group Messenger Chat Box -->
            <div class="flex-1 flex flex-col overflow-hidden">
                <div class="px-4 py-2 border-b border-[#30363d] flex items-center justify-between bg-[#0d1117]/30">
                    <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Live Chat Room</span>
                    <span id="room-display-tag" class="text-xs text-blue-400 font-mono bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20"></span>
                </div>
                <!-- Chat Feed -->
                <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                    <div class="text-xs text-gray-500 italic text-center">Welcome to the Room. Type a message below to chat without interrupting the audio!</div>
                </div>
                <!-- Chat Entry Form -->
                <div class="p-4 border-t border-[#30363d] bg-[#0d1117]/50">
                    <div class="flex space-x-2">
                        <input type="text" id="chat-input" placeholder="Type a message..." 
                               class="flex-1 bg-[#0d1117] border border-[#30363d] text-white px-3 py-2 rounded-lg text-sm focus:outline-none focus:border-blue-500">
                        <button onclick="sendChatMessage()" class="bg-[#21262d] hover:bg-[#30363d] border border-[#30363d] text-white px-4 rounded-lg transition cursor-pointer">
                            Send
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bottom Media Controller Footprint -->
            <div class="p-4 border-t border-[#30363d] bg-[#0d1117] flex justify-center space-x-4">
